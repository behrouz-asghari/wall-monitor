# ---------------------------------------------------------------------------
# WallGold collector — 5-minute scheduler (GitHub Actions).
#
# Vercel Hobby plans limit *native* cron jobs to daily, so the schedule lives
# here instead: it calls the CRON_SECRET-secured collector endpoint on Vercel.
# The endpoint itself is identical to the Vercel Cron one (same Authorization:
# Bearer header), so upgrading to Vercel Pro later simply means restoring
# `"schedule": "* * * * *"` in vercel.json and deleting this workflow —
# nothing else changes.
#
# Cadence: GitHub's documented floor is "the shortest interval you can run
# scheduled workflows is once every 5 minutes" — `* * * * *` is accepted
# syntactically but never registers a schedule (verified: schedules endpoint
# returns 404 and zero schedule runs). `*/5 * * * *` is the fastest legal
# native cadence on the free tier.
#
# Note: GitHub may delay scheduled runs by a minute or two, and scheduled
# workflows are disabled automatically after ~60 days of repository
# inactivity. The collector is idempotent, so missed/delayed runs are safe —
# the next run always catches up.
# ---------------------------------------------------------------------------

name: WallGold collector

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger secured collector endpoint
        env:
          COLLECTOR_URL: https://walldb.vercel.app/api/cron/wallgold
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET secret is not configured" >&2
            exit 1
          fi
          http_code=$(curl -sS -o response.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            --max-time 120 \
            "${COLLECTOR_URL}")
          cat response.json
          echo
          if [ "$http_code" != "200" ]; then
            echo "Collector returned HTTP ${http_code}" >&2
            exit 1
          fi
