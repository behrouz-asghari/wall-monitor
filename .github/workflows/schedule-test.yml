name: Schedule test

on:
  push:
    branches:
      - main
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger test
        run: |
          echo "TRIGGER TEST"
          echo "Event: ${{ github.event_name }}"
          echo "UTC: $(date -u)"
